name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: python scripts/check-desktop-boundaries.py
      - run: cargo test -p circuitfabric-desktop
      - run: cargo test --workspace --exclude circuitfabric-desktop
      - run: cargo clippy --workspace --exclude circuitfabric-desktop --all-targets -- -D warnings
