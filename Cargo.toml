[workspace]
members = [
  "apps/circuitfabric-desktop",
  "crates/circuitfabric-contracts",
  "crates/circuitfabric-core",
  "crates/circuitfabric-codex-runtime",
  "crates/circuitfabric-document",
  "crates/circuitfabric-plugin-api",
  "crates/circuitfabric-project",
  "crates/circuitfabric-store",
  "plugins/jlcircuit-eda-bridge",
]
default-members = [
  "crates/circuitfabric-contracts",
  "crates/circuitfabric-core",
  "crates/circuitfabric-codex-runtime",
  "crates/circuitfabric-document",
  "crates/circuitfabric-plugin-api",
  "crates/circuitfabric-project",
  "crates/circuitfabric-store",
  "plugins/jlcircuit-eda-bridge",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
circuitfabric-contracts = { path = "crates/circuitfabric-contracts" }
circuitfabric-core = { path = "crates/circuitfabric-core" }
circuitfabric-codex-runtime = { path = "crates/circuitfabric-codex-runtime" }
circuitfabric-document = { path = "crates/circuitfabric-document" }
circuitfabric-plugin-api = { path = "crates/circuitfabric-plugin-api" }
circuitfabric-project = { path = "crates/circuitfabric-project" }
circuitfabric-store = { path = "crates/circuitfabric-store" }
jlcircuit-eda-bridge = { path = "plugins/jlcircuit-eda-bridge" }
dunce = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
