[workspace]
members = [
  "apps/circuitfabric-desktop",
  "crates/circuitfabric-contracts",
  "crates/circuitfabric-core",
  "crates/circuitfabric-codex-runtime",
  "crates/circuitfabric-document",
  "crates/circuitfabric-document-opener",
  "crates/circuitfabric-plugin-api",
  "crates/circuitfabric-project",
  "crates/circuitfabric-store",
  "plugins/jlcircuit-eda-bridge",
]
default-members = [
  "crates/circuitfabric-contracts",
  "crates/circuitfabric-core",
  "crates/circuitfabric-codex-runtime",
  "crates/circuitfabric-document",
  "crates/circuitfabric-document-opener",
  "crates/circuitfabric-plugin-api",
  "crates/circuitfabric-project",
  "crates/circuitfabric-store",
  "plugins/jlcircuit-eda-bridge",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
circuitfabric-contracts = { path = "crates/circuitfabric-contracts" }
circuitfabric-core = { path = "crates/circuitfabric-core" }
circuitfabric-codex-runtime = { path = "crates/circuitfabric-codex-runtime" }
circuitfabric-document = { path = "crates/circuitfabric-document" }
circuitfabric-document-opener = { path = "crates/circuitfabric-document-opener" }
circuitfabric-plugin-api = { path = "crates/circuitfabric-plugin-api" }
circuitfabric-project = { path = "crates/circuitfabric-project" }
circuitfabric-store = { path = "crates/circuitfabric-store" }
jlcircuit-eda-bridge = { path = "plugins/jlcircuit-eda-bridge" }
calamine = "0.26"
dunce = "1.0"
pdf-extract = "0.7"
pdfium-render = "0.8"
pulldown-cmark = { version = "0.12", default-features = false }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Dependencies (GPUI, pdfium bindings, PDF parsing) are optimized even in dev builds so
# the desktop UI stays responsive under `cargo run`; workspace crates keep full debug info
# and fast incremental builds.
[profile.dev.package."*"]
opt-level = 2
