[package]
name = "circuitfabric-desktop"
version = "0.1.0"
description = "GPUI desktop control plane for CircuitFabric."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
ui-test-support = ["native-ui", "gpui/test-support", "gpui_platform/test-support"]
native-ui = [
  "dep:gpui",
  "dep:gpui-component",
  "dep:gpui_platform",
  "dep:gpui-base",
  "dep:rfd",
  "dep:circuitfabric-document-opener",
  "dep:circuitfabric-plugin-api",
  "dep:pulldown-cmark",
]

[dependencies]
circuitfabric-codex-runtime.workspace = true
circuitfabric-contracts.workspace = true
circuitfabric-document-opener = { workspace = true, optional = true, features = [
  "raster-pdf",
] }
circuitfabric-plugin-api = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
circuitfabric-project.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = "0.25"
jlcircuit-eda-bridge.workspace = true
serde_json.workspace = true
serde.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.8", optional = true }
gpui-component = { version = "0.7.1", optional = true }
gpui-component-assets = { package = "gpui-kit-assets", version = "0.7.1" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", optional = true, features = ["font-kit"] }
gpui-base = { version = "0.7.1", optional = true }
rfd = { version = "0.16", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"

[lints.rust]
# The Windows platform adapter has one narrowly scoped FFI module. The crate
# denies unsafe code by default and explicitly permits it only for that module.
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
