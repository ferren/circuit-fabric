<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircuitFabric 助手</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f6fa;--line:#d8e0ec;--muted:#657187;--blue:#2463eb;--green:#16834f;--red:#b42318}*{box-sizing:border-box}body{margin:0;height:100vh}.app{height:100%;display:flex;flex-direction:column}.header,.composer{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row,.composer-row,.execution-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:42px;height:42px;border-radius:11px}h1{margin:0;font-size:18px}.subtitle,.runtime-status,.hint{margin:4px 0 0;color:var(--muted);font-size:11px}.connection{font-size:12px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#9aa7b8}.dot.connected{background:var(--green)}.dot.error{background:var(--red)}.live{padding:10px 16px;border-bottom:1px solid #c9d6eb;background:#edf3ff}.live.done{background:#e8f7ef;border-color:#b8dbc8}.live.failed{background:#fff0ee;border-color:#efb6af}.live-main{display:flex;align-items:center;gap:9px;max-width:760px;margin:auto}.indicator{width:12px;height:12px;border:2px solid #b8c9ed;border-top-color:var(--blue);border-radius:50%}.running .indicator{animation:spin .8s linear infinite}.done .indicator{background:var(--green);border:0}.failed .indicator{background:var(--red);border:0}@keyframes spin{to{transform:rotate(360deg)}}.live-copy{flex:1;min-width:0}.live-state{font-weight:700;font-size:13px}.live-phase{margin-top:2px;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metric{max-width:760px;margin:6px auto 0;color:#405475;font-size:11px}.conversation{flex:1;overflow:auto;padding:14px 16px}.welcome{max-width:620px;margin:12px auto;color:var(--muted);text-align:center;font-size:13px}.message,.execution{max-width:760px;margin:0 auto 12px}.message{display:flex}.bubble{max-width:88%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:13px}.user{justify-content:flex-end}.user .bubble{color:#fff;border-color:var(--blue);background:var(--blue)}.error .bubble{color:var(--red);border-color:#f0b4ae;background:#fff0ee}.execution{padding:12px;border:1px solid #b9c9ee;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgb(31 60 120 / 5%)}.execution-answer{margin-top:10px;white-space:pre-wrap;line-height:1.5}.execution-metrics{margin-top:7px;color:var(--muted);font-size:10px}.composer{border-top:1px solid var(--line);border-bottom:0}.settings{display:flex;gap:8px;margin-bottom:8px}input,textarea{width:100%;padding:8px 9px;border:1px solid #c7d2e2;border-radius:8px;outline:0;font:inherit;background:#fbfcfe}input{font-size:11px}textarea{display:block;min-height:72px;resize:vertical;font-size:13px}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgb(36 99 235 / 12%)}button{border:0;border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.primary{color:#fff;background:var(--blue)}.secondary{color:#172033;background:#e7edf7}.small{color:var(--muted);background:transparent}button:disabled{cursor:wait;opacity:.55}@media(max-width:580px){.settings,.composer-row{flex-direction:column;align-items:stretch}.header-row{align-items:flex-start}.connection{margin-top:3px}}
</style></head><body><main class="app">
<header class="header"><div class="header-row"><div class="brand"><img class="brand-icon" src="/assets/circuitfabric-logo.png" alt="CircuitFabric"><div><h1>CircuitFabric 助手</h1><p class="subtitle">连续对话、流式回复；EDA 写入只生成建议，等待确认链路。</p><p class="runtime-status">Codex App Server 经本机 Bridge 连接，API Key 不进入 EDA 扩展。</p></div></div><div class="connection"><span id="dot" class="dot"></span><span id="connection">检查连接中</span></div></div></header>
<section id="live" class="live"><div class="live-main"><span class="indicator"></span><div class="live-copy"><div id="liveState" class="live-state">当前状态：就绪</div><div id="livePhase" class="live-phase">等待新的分析或修改要求</div></div><span id="elapsed" class="hint">--</span></div><div id="metrics" class="metric">模型请求 0 · 工具调用 0 · Token 尚无统计</div></section>
<section id="conversation" class="conversation" aria-live="polite"><div id="welcome" class="welcome">可以连续输入问题或修改要求。按 Enter 发送，按 Shift + Enter 换行。当前版本会保留会话，但不会直接改写 EDA。</div></section>
<footer class="composer"><div class="settings"><input id="project" value="default-project" placeholder="CircuitFabric 项目 ID"><input id="bridge" value="ws://127.0.0.1:49630/bridge" placeholder="Bridge 地址"></div><textarea id="instruction" placeholder="例如：检查当前原理图的电源输入风险，并给出修改建议"></textarea><div class="composer-row"><span id="session" class="hint"></span><div><button id="clear" class="small">清空对话</button><button id="refresh" class="secondary">重新连接</button><button id="send" class="primary">发送</button></div></div></footer>
</main><script>
const $=id=>document.getElementById(id);let sessionId,newMessage,socket,busy=false,startedAt=0,timer,modelRequests=0;const newId=()=>crypto.randomUUID?crypto.randomUUID():`eda-${Date.now()}-${Math.random().toString(16).slice(2)}`;sessionId=newId();$("session").textContent=`当前会话：${sessionId.slice(0,8)}`;
function status(kind,text){$("dot").className=`dot ${kind}`;$("connection").textContent=text}function scroll(){$("conversation").scrollTop=$("conversation").scrollHeight}function add(role,text){$("welcome").style.display="none";const row=document.createElement("article");row.className=`message ${role}`;const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;row.append(bubble);$("conversation").append(row);scroll();return bubble}function start(){busy=true;startedAt=performance.now();$("send").disabled=true;$("live").className="live running";$("liveState").textContent="当前状态：执行中";$("livePhase").textContent="正在连接 Agent…";timer=setInterval(()=>$("elapsed").textContent=`${((performance.now()-startedAt)/1000).toFixed(1)}s`,100)}function finish(ok,detail){clearInterval(timer);busy=false;$("send").disabled=false;$("live").className=`live ${ok?"done":"failed"}`;$("liveState").textContent=`当前状态：${ok?"执行完成":"执行失败"}`;$("livePhase").textContent=detail;$("elapsed").textContent=`${((performance.now()-startedAt)/1000).toFixed(1)}s`;$("metrics").textContent=`模型请求 ${modelRequests} · 工具调用 0 · Token 由 Codex App Server 统计`}
function connect(){return new Promise((resolve,reject)=>{if(socket?.readyState===WebSocket.OPEN)return resolve();status("","正在连接");socket=new WebSocket($("bridge").value);socket.onopen=()=>socket.send(JSON.stringify({type:"hello",protocolVersion:1,projectId:$("project").value.trim()}));socket.onmessage=event=>{let m;try{m=JSON.parse(event.data)}catch{return}if(m.type==="hello_ack"){status("connected","Bridge 已连接");resolve()}else if(m.type==="chat_started"){$("livePhase").textContent="Codex 正在处理请求…"}else if(m.type==="chat_delta"){newMessage??=add("assistant","");newMessage.textContent+=m.delta;scroll()}else if(m.type==="chat_completed"){finish(true,"最近一次请求已完成");newMessage=null}else if(m.type==="error"){add("error",m.message||"Bridge 请求失败");finish(false,m.message||"Bridge 请求失败");newMessage=null}};socket.onerror=()=>{status("error","Bridge 不可用");reject(new Error("无法连接本机 bridge；请先启动 circuitfabric-jlc-bridge。"))};socket.onclose=()=>status("","已断开")})}
async function send(){const text=$("instruction").value.trim();if(!text||busy)return;start();add("user",text);$("instruction").value="";modelRequests++;try{await connect();socket.send(JSON.stringify({type:"chat",sessionId,text}))}catch(error){add("error",String(error.message||error));finish(false,String(error.message||error))}}$("send").onclick=send;$("refresh").onclick=()=>{socket?.close();connect().catch(error=>add("error",String(error.message||error)))};$("clear").onclick=()=>{if(busy)return;sessionId=newId();$("session").textContent=`当前会话：${sessionId.slice(0,8)}`;$("conversation").innerHTML="";$("conversation").append($("welcome"));$("welcome").style.display="";modelRequests=0;$("live").className="live";$("liveState").textContent="当前状态：就绪";$("livePhase").textContent="已创建新的本地会话";$("elapsed").textContent="--";$("metrics").textContent="模型请求 0 · 工具调用 0 · Token 尚无统计"};$("instruction").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();send()}});connect().catch(()=>{});
</script></body></html>
