<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircuitFabric 助手</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f6fa;--line:#d8e0ec;--muted:#657187;--blue:#2463eb;--green:#16834f;--red:#b42318}*{box-sizing:border-box}body{margin:0;height:100vh}.app{height:100%;display:flex;flex-direction:column}.header,.composer{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}.header-row,.composer-row,.execution-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.header-controls{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0;flex-shrink:1}.selector-row{display:flex;align-items:center;gap:8px}.bridge-address{width:260px;max-width:260px;padding:5px 7px;font-size:10px}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:42px;height:42px;border-radius:11px}h1{margin:0;font-size:18px}.subtitle,.runtime-status,.hint{margin:4px 0 0;color:var(--muted);font-size:11px}.connection{font-size:12px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#9aa7b8}.dot.connected{background:var(--green)}.dot.error{background:var(--red)}select{max-width:170px;padding:6px 8px;border:1px solid #c7d2e2;border-radius:8px;outline:0;font:inherit;font-size:12px;color:#172033;background:#fbfcfe;text-overflow:ellipsis}select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgb(36 99 235 / 12%)}select:disabled{opacity:.55}.live{padding:10px 16px;border-bottom:1px solid #c9d6eb;background:#edf3ff}.live.done{background:#e8f7ef;border-color:#b8dbc8}.live.failed{background:#fff0ee;border-color:#efb6af}.live-main{display:flex;align-items:center;gap:9px;max-width:760px;margin:auto}.indicator{width:12px;height:12px;border:2px solid #b8c9ed;border-top-color:var(--blue);border-radius:50%}.running .indicator{animation:spin .8s linear infinite}.done .indicator{background:var(--green);border:0}.failed .indicator{background:var(--red);border:0}@keyframes spin{to{transform:rotate(360deg)}}.live-copy{flex:1;min-width:0}.live-state{font-weight:700;font-size:13px}.live-phase{margin-top:2px;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metric{max-width:760px;margin:6px auto 0;color:#405475;font-size:11px}.conversation{flex:1;overflow:auto;padding:14px 16px}.welcome{max-width:620px;margin:12px auto;color:var(--muted);text-align:center;font-size:13px}.message,.execution{max-width:760px;margin:0 auto 12px}.message{display:flex}.bubble{max-width:88%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:13px}.user{justify-content:flex-end}.user .bubble{color:#fff;border-color:var(--blue);background:var(--blue)}.error .bubble{color:var(--red);border-color:#f0b4ae;background:#fff0ee}.execution{padding:12px;border:1px solid #b9c9ee;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgb(31 60 120 / 5%)}.execution-answer{margin-top:10px;white-space:pre-wrap;line-height:1.5}.execution-metrics{margin-top:7px;color:var(--muted);font-size:10px}.composer{border-top:1px solid var(--line);border-bottom:0}input,textarea{width:100%;padding:8px 9px;border:1px solid #c7d2e2;border-radius:8px;outline:0;font:inherit;background:#fbfcfe}input{font-size:11px}textarea{display:block;min-height:72px;resize:vertical;font-size:13px}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgb(36 99 235 / 12%)}button{border:0;border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.primary{color:#fff;background:var(--blue)}.secondary{color:#172033;background:#e7edf7}.small{color:var(--muted);background:transparent}button:disabled{cursor:wait;opacity:.55}@media(max-width:580px){.composer-row{flex-direction:column;align-items:stretch}.header-row{align-items:flex-start;flex-wrap:wrap}.header-controls{align-items:stretch}.selector-row{flex-wrap:wrap;justify-content:flex-end}select{max-width:140px}.bridge-address{width:100%;max-width:100%}.connection{margin-top:3px}.reasoning-body{max-height:88px}}@media(max-height:560px){.reasoning-body{max-height:80px}.plan-review{max-height:30vh}.conversation{padding:10px 12px}}
.live.uncertain{background:#fff7df;border-color:#e5c677}.uncertain .indicator{background:#a66b00;border:0}.plan-review{display:flex;flex-direction:column;gap:8px;padding:10px 16px;background:#fff8e8;border-top:1px solid #e5c677;max-height:35vh}.plan-review-scroll{flex:1 1 auto;min-height:0;overflow:auto}.plan-review pre{white-space:pre-wrap;font:inherit;font-size:12px;line-height:1.5}.plan-actions{display:flex;flex-wrap:wrap;gap:6px;flex:0 0 auto}.rollback-warning{padding:8px 10px;border:1px solid var(--red);border-radius:6px;background:#fff0ee;color:var(--red);font-size:12px;font-weight:600;white-space:pre-wrap}.reasoning{margin:0 0 8px;border-left:3px solid #c9d6eb;padding-left:8px}.reasoning-head{cursor:pointer;color:var(--muted);font-size:11px;-webkit-user-select:none;user-select:none}.reasoning-body{max-height:112px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#405475;font-size:12px;line-height:1.45}
</style></head><body><main class="app">
<header class="header"><div class="header-row"><div class="brand"><img class="brand-icon" src="/assets/circuitfabric-logo.png" alt="CircuitFabric"><div><h1>CircuitFabric 助手</h1><p class="subtitle">连续对话、流式回复；EDA 写入只生成建议，等待确认链路。</p><p class="runtime-status">Codex App Server 经本机 Bridge 连接，API Key 不进入 EDA 扩展。</p></div></div><div class="header-controls"><div class="selector-row"><select id="projectSelect" disabled><option value="">连接后选择项目</option></select><select id="sessionSelect" disabled><option value="">新会话</option></select><div class="connection"><span id="dot" class="dot"></span><span id="connection">检查连接中</span></div></div><input id="bridge" class="bridge-address" value="ws://127.0.0.1:49630/bridge" placeholder="Bridge 地址"></div></div></header>
<section id="live" class="live"><div class="live-main"><span class="indicator"></span><div class="live-copy"><div id="liveState" class="live-state">当前状态：就绪</div><div id="livePhase" class="live-phase">等待新的分析或修改要求</div></div><span id="elapsed" class="hint">--</span></div><div id="metrics" class="metric">模型请求 0 · 工具调用 0 · Token 尚无统计</div></section>
<section id="conversation" class="conversation" aria-live="polite"><div id="welcome" class="welcome">可以连续输入问题或修改要求。按 Enter 发送，按 Shift + Enter 换行。当前版本会保留会话，但不会直接改写 EDA。</div></section>
<section id="planReview" class="plan-review" style="display:none" aria-live="polite"><strong>变更计划与审批</strong><div id="rollbackWarnings" class="rollback-warning" role="alert" style="display:none"></div><div class="plan-review-scroll"><pre id="planDetails"></pre></div><div class="plan-actions"><button id="approvePlan" class="secondary" disabled>批准计划（不执行）</button><button id="rejectPlan" class="secondary" disabled>拒绝计划</button><button id="applyPlan" class="primary" disabled>执行已批准计划</button><button id="readbackPlan" class="secondary" disabled>重新回读</button><button id="rollbackPlan" class="secondary" disabled>回滚</button><button id="cancelPlan" class="secondary" disabled>取消后续步骤</button></div></section>
<footer class="composer"><textarea id="instruction" placeholder="例如：检查当前原理图的电源输入风险，并给出修改建议"></textarea><div class="composer-row"><span id="session" class="hint"></span><div><button id="inspectBtn" class="secondary" disabled>观测当前设计</button><button id="drcBtn" class="secondary" disabled>DRC 检查</button><button id="captureBtn" class="secondary" disabled>画布截图</button><button id="clear" class="small">清空对话</button><button id="refresh" class="secondary">重新连接</button><button id="send" class="primary" disabled>发送</button></div></div></footer>
</main><script src="/iframe/compat.js"></script></body></html>
